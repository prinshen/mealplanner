<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Protein Log">
<link rel="manifest" href="./manifest.webmanifest"><title>Protein Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171719;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.app{max-width:620px;margin:auto;padding:18px 15px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}.date{font-size:22px;font-weight:750}.sub{font-size:12px;color:#777;margin-top:2px}.nav{border:0;background:#fff;width:42px;height:42px;border-radius:14px;font-size:26px}.card{background:#fff;border:1px solid #e8e8eb;border-radius:22px;box-shadow:0 2px 8px #00000008}.hero{padding:18px;display:grid;justify-items:center}.ring{--p:0deg;width:176px;height:176px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#237a52 var(--p),#e9ecea 0);position:relative}.ring:after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%}.inside{z-index:1;text-align:center}.big{font-size:30px;font-weight:800}.goal,.muted{color:#777}.over{height:18px;color:#237a52;font-weight:750}.kcal{margin-top:12px;color:#777}.kcal b{color:#171719;font-size:18px}.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#777;font-weight:750;margin:18px 3px 8px}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.quick button{min-width:135px;text-align:left;background:#fff;border:1px solid #e6e6e8;border-radius:16px;padding:11px}.quick strong{display:block}.quick small{color:#777}.meal{margin-top:10px;overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:15px 16px}.mt{font-size:18px;font-weight:750}.add{border:0;background:#edf6f1;color:#176b45;border-radius:13px;padding:9px 12px;font-weight:750}.entry{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid #eee}.ename{font-weight:650}.mac{text-align:right}.mac b{display:block}.empty{padding:0 16px 15px;color:#999}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#f8f8f9ed;border-top:1px solid #ddd;backdrop-filter:blur(18px)}.tabs button{border:0;background:none;padding:8px;color:#888}.tabs .on{color:#237a52;font-weight:750}.head{display:flex;justify-content:space-between;align-items:center}.btn{border:0;background:#237a52;color:white;border-radius:14px;padding:11px 15px;font-weight:750}.saved{padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}.saved strong{font-size:17px}.edit{border:1px solid #ddd;background:white;border-radius:12px;padding:8px 11px}.setting{padding:15px;margin-bottom:12px}.setting label{display:block;font-weight:700;margin-bottom:7px}input,textarea,select{width:100%;font:inherit;border:1px solid #d9d9de;background:white;border-radius:13px;padding:12px;outline:none}textarea{min-height:105px;resize:none}.help{font-size:12px;color:#777;line-height:1.4;margin-top:7px}.modal{position:fixed;inset:0;background:#0005;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#f8f8fa;width:min(100%,620px);max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}.handle{width:40px;height:5px;border-radius:9px;background:#ccc;margin:auto auto 14px}.mh2{display:flex;justify-content:space-between;align-items:center}.mh2 h2{margin:0}.x{border:0;background:none;font-size:25px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#777;font-weight:700;margin:0 0 6px 2px}.summary{padding:15px;margin:12px 0}.summary b{font-size:22px}.ings{background:#fff;border:1px solid #e5e5e7;border-radius:16px;overflow:hidden}.ing{display:grid;grid-template-columns:1.3fr .65fr .6fr;gap:6px;padding:8px;border-bottom:1px solid #eee}.ing:last-child{border-bottom:0}.ing input{padding:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.secondary{border:1px solid #ddd;background:white;color:#171719;border-radius:14px;padding:12px;font-weight:700}.danger{color:#b3261e}.error{background:#fff0ef;color:#8b2119;padding:11px;border-radius:12px;font-size:13px;margin-top:10px}.hide{display:none!important}h1{font-size:28px;margin:4px 0 16px}
</style>
</head>
<body><main id="app" class="app"></main><nav class="tabs"><button class="on" data-tab="today">Today</button><button data-tab="saved">Saved</button><button data-tab="settings">Settings</button></nav><div id="modal"></div>
<script>
(()=>{'use strict';
const K='proteinLog.v1',types=['breakfast','lunch','dinner','snacks'],labels={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',snacks:'Snacks'};let tab='today',date=key(new Date()),S=load();const A=document.querySelector('#app'),M=document.querySelector('#modal');
function base(){return{settings:{proteinTarget:160,aiEndpoint:''},days:{},savedMeals:[]}}function load(){try{return Object.assign(base(),JSON.parse(localStorage.getItem(K)||'{}'))}catch{return base()}}function save(){localStorage.setItem(K,JSON.stringify(S))}function day(k){return S.days[k]||(S.days[k]={date:k,entries:[]})}function totals(d){return(d.entries||[]).reduce((a,e)=>(a.p+=+e.protein||0,a.c+=+e.calories||0,a),{p:0,c:0})}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function round(x){x=+x||0;return Math.abs(x-Math.round(x))<.05?Math.round(x):x.toFixed(1)}function key(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),q=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${q}`}function from(k){let[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}function shift(k,n){let d=from(k);d.setDate(d.getDate()+n);return key(d)}function pretty(k){return new Intl.DateTimeFormat('en',{weekday:'short',day:'numeric',month:'short'}).format(from(k))}function long(k){return new Intl.DateTimeFormat('en',{day:'numeric',month:'long',year:'numeric'}).format(from(k))}
function render(){if(tab==='today')today();if(tab==='saved')saved();if(tab==='settings')settings()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
function today(){let d=day(date),t=totals(d),goal=+S.settings.proteinTarget||160,p=Math.min(1,t.p/goal),over=Math.max(0,t.p-goal),now=key(new Date()),quick=[...S.savedMeals].sort((a,b)=>(b.usageCount||0)-(a.usageCount||0)).slice(0,4);A.innerHTML=`<div class="top"><button class="nav" id="prev">‹</button><div style="text-align:center"><div class="date">${date===now?'Today':esc(pretty(date))}</div><div class="sub">${esc(long(date))}</div></div><button class="nav" id="next" ${date>=now?'disabled':''}>›</button></div><section class="card hero"><div class="ring" style="--p:${Math.round(p*360)}deg"><div class="inside"><div class="big">${round(t.p)} g</div><div class="goal">of ${round(goal)} g</div><div class="over">${over?`+${round(over)} g`:''}</div></div></div><div class="kcal"><b>${Math.round(t.c).toLocaleString()}</b> kcal</div></section>${quick.length?`<div class="kicker">Quick add</div><div class="quick">${quick.map(x=>`<button data-q="${x.id}"><strong>${esc(x.name)}</strong><small>${round(x.protein)} g · ${Math.round(x.calories)} kcal</small></button>`).join('')}</div>`:''}${types.map(x=>meal(x,d)).join('')}`;document.querySelector('#prev').onclick=()=>{date=shift(date,-1);today()};document.querySelector('#next').onclick=()=>{if(date<now){date=shift(date,1);today()}};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>food(b.dataset.add));document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editEntry(b.dataset.e));document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>quickAdd(b.dataset.q))}
function meal(type,d){let es=d.entries.filter(e=>e.category===type),p=es.reduce((a,e)=>a+(+e.protein||0),0);return`<section class="card meal"><div class="mh"><div><div class="mt">${labels[type]}</div><div class="sub">${es.length?round(p)+' g protein':'No food added'}</div></div><button class="add" data-add="${type}">+ Add</button></div>${es.length?es.map(e=>`<div class="entry" data-e="${e.id}"><div><div class="ename">${esc(e.name||e.description||'Meal')}</div>${e.source==='saved'?'<div class="sub">Saved meal</div>':''}</div><div class="mac"><b>${round(e.protein)} g</b><span class="sub">${Math.round(e.calories)} kcal</span></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</section>`}
function saved(){let xs=[...S.savedMeals].sort((a,b)=>(b.usageCount||0)-(a.usageCount||0));A.innerHTML=`<div class="head"><h1>Saved meals</h1><button class="btn" id="new">+ New</button></div>${xs.length?xs.map(x=>`<div class="card saved"><div><strong>${esc(x.name)}</strong><div class="sub">${labels[x.category]} · ${round(x.protein)} g · ${Math.round(x.calories)} kcal</div></div><button class="edit" data-s="${x.id}">Edit</button></div>`).join(''):'<div class="card setting muted">No saved meals yet.</div>'}`;document.querySelector('#new').onclick=()=>savedModal();document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>savedModal(b.dataset.s))}
function settings(){A.innerHTML=`<h1>Settings</h1><div class="card setting"><label>Daily protein target</label><input id="goal" type="number" inputmode="decimal" min="1" value="${+S.settings.proteinTarget||160}"><div class="help">The same target is used every day.</div></div><div class="kicker">AI connection</div><div class="card setting"><label>AI endpoint URL</label><input id="endpoint" type="url" placeholder="https://…/analyze-food" value="${esc(S.settings.aiEndpoint||'')}"><div class="help">The app POSTs your food description to this endpoint and expects structured nutrition JSON back. No API key is stored here.</div></div><div class="card setting"><b>Storage</b><div class="help">Meals and settings are stored locally on this iPhone/browser.</div></div>`;document.querySelector('#goal').onchange=e=>{S.settings.proteinTarget=Math.max(1,+e.target.value||160);save()};document.querySelector('#endpoint').onchange=e=>{S.settings.aiEndpoint=e.target.value.trim();save()}}
function food(category,existing=null){let ana=existing?{name:existing.name,protein:existing.protein,calories:existing.calories,ingredients:existing.ingredients||[]}:null;M.innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="mh2"><h2>${existing?'Edit meal':'Add '+labels[category]}</h2><button class="x" id="close">×</button></div><div class="field"><label>What did you eat?</label><textarea id="desc" placeholder="e.g. 100g oats with milk, 10 raisins and 5 almonds">${esc(existing?.description||'')}</textarea></div><button class="btn" id="analyze">Analyze</button><div id="err"></div><div id="result"></div>${existing?'<div class="actions"><button class="secondary danger" id="delete">Delete</button><button class="btn" id="save">Save</button></div>':''}</div></div>`;let desc=document.querySelector('#desc'),R=document.querySelector('#result');document.querySelector('#close').onclick=close;if(ana)show();document.querySelector('#analyze').onclick=async()=>{let text=desc.value.trim();if(!text)return;try{ana=await analyze(text,category);show()}catch(e){document.querySelector('#err').innerHTML=`<div class="error">${esc(e.message)}</div>`}};if(existing){document.querySelector('#delete').onclick=()=>{let d=day(date);d.entries=d.entries.filter(e=>e.id!==existing.id);save();close();today()};document.querySelector('#save').onclick=()=>commit()}function show(){R.innerHTML=`<div class="card summary"><b>~${round(ana.protein)} g protein</b><div class="muted">~${Math.round(ana.calories)} kcal</div></div>${ana.ingredients?.length?`<div class="kicker">Ingredients</div><div class="ings">${ana.ingredients.map((i,n)=>`<div class="ing"><input data-n="${n}" data-f="name" value="${esc(i.name)}"><input data-n="${n}" data-f="amount" value="${esc(i.amount)}"><input data-n="${n}" data-f="unit" value="${esc(i.unit)}"></div>`).join('')}</div><div class="help">You can correct ingredient amounts. Tap Recalculate so nutrition stays consistent.</div><button class="secondary" id="recalc" style="margin-top:9px">Recalculate</button>`:''}<div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="btn" id="addmeal">${existing?'Save meal':'Add meal'}</button></div>`;document.querySelector('#cancel').onclick=close;document.querySelector('#addmeal').onclick=commit;let rc=document.querySelector('#recalc');if(rc)rc.onclick=async()=>{document.querySelectorAll('.ing input').forEach(x=>ana.ingredients[+x.dataset.n][x.dataset.f]=x.value);try{ana=await analyze(desc.value.trim(),category,ana.ingredients);show()}catch(e){document.querySelector('#err').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}function commit(){if(!ana)return;let d=day(date),entry={id:existing?.id||uid(),category,description:desc.value.trim(),name:ana.name||desc.value.trim().slice(0,50),protein:+ana.protein,calories:+ana.calories,ingredients:ana.ingredients||[],source:'ai'};let i=d.entries.findIndex(x=>x.id===entry.id);if(i>=0)d.entries[i]=entry;else d.entries.push(entry);save();close();today()}}
function editEntry(id){let e=day(date).entries.find(x=>x.id===id);if(!e)return;if(e.source==='saved'){M.innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="mh2"><h2>${esc(e.name)}</h2><button class="x" id="close">×</button></div><div class="card summary"><b>${round(e.protein)} g protein</b><div class="muted">${Math.round(e.calories)} kcal</div></div><div class="actions"><button class="secondary danger" id="delete">Delete</button><button class="btn" id="done">Done</button></div></div></div>`;document.querySelector('#close').onclick=close;document.querySelector('#done').onclick=close;document.querySelector('#delete').onclick=()=>{let d=day(date);d.entries=d.entries.filter(x=>x.id!==id);save();close();today()}}else food(e.category,e)}
function savedModal(id){let old=S.savedMeals.find(x=>x.id===id),ana=old?{name:old.name,protein:old.protein,calories:old.calories,ingredients:old.ingredients||[]}:null;M.innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="mh2"><h2>${old?'Edit saved meal':'New saved meal'}</h2><button class="x" id="close">×</button></div><div class="field"><label>Name</label><input id="name" value="${esc(old?.name||'')}"></div><div class="field"><label>Usual meal</label><select id="cat">${types.map(x=>`<option value="${x}" ${x===(old?.category||'breakfast')?'selected':''}>${labels[x]}</option>`).join('')}</select></div><div class="field"><label>Description</label><textarea id="desc" placeholder="e.g. Huel Black, two scoops">${esc(old?.description||'')}</textarea></div><button class="btn" id="analyze">Analyze</button><div id="err"></div><div id="result"></div>${old?'<button class="secondary danger" id="delete" style="margin-top:12px;width:100%">Delete saved meal</button>':''}</div></div>`;document.querySelector('#close').onclick=close;let R=document.querySelector('#result');if(ana)show();document.querySelector('#analyze').onclick=async()=>{try{ana=await analyze(document.querySelector('#desc').value.trim(),document.querySelector('#cat').value);show()}catch(e){document.querySelector('#err').innerHTML=`<div class="error">${esc(e.message)}</div>`}};if(old)document.querySelector('#delete').onclick=()=>{S.savedMeals=S.savedMeals.filter(x=>x.id!==id);save();close();saved()};function show(){R.innerHTML=`<div class="kicker">Fixed nutrition</div><div class="card setting"><label>Protein (g)</label><input id="p" type="number" step="0.1" value="${ana.protein}"><label style="margin-top:10px">Calories</label><input id="c" type="number" step="1" value="${ana.calories}"></div><button class="btn" id="savemeal" style="width:100%">Save meal</button>`;document.querySelector('#savemeal').onclick=()=>{let x={id:old?.id||uid(),name:document.querySelector('#name').value.trim()||ana.name||'Saved meal',category:document.querySelector('#cat').value,description:document.querySelector('#desc').value.trim(),protein:+document.querySelector('#p').value||0,calories:+document.querySelector('#c').value||0,ingredients:ana.ingredients||[],usageCount:old?.usageCount||0};let i=S.savedMeals.findIndex(z=>z.id===x.id);if(i>=0)S.savedMeals[i]=x;else S.savedMeals.push(x);save();close();saved()}}}
function quickAdd(id){let m=S.savedMeals.find(x=>x.id===id);if(!m)return;day(date).entries.push({id:uid(),category:m.category,name:m.name,protein:+m.protein,calories:+m.calories,ingredients:m.ingredients||[],source:'saved',savedMealId:m.id});m.usageCount=(m.usageCount||0)+1;save();today()}
async function analyze(text,mealType,editedIngredients=null){let ep=(S.settings.aiEndpoint||'').trim();if(ep){let r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'estimate_nutrition',text,mealType,language:'auto',priorities:['protein','calories'],behavior:{estimateMissingAmountsFromContext:true,avoidFollowUpUnlessUninterpretable:true,markEstimatedAmounts:true},editedIngredients})});if(!r.ok)throw new Error('AI request failed ('+r.status+').');let raw=await r.json(),x=raw.result||raw.data||raw;if(typeof x==='string')x=JSON.parse(x);if(!Number.isFinite(+x.protein)||!Number.isFinite(+x.calories))throw new Error('Unexpected AI response format.');return{name:x.name||x.title||text,protein:+x.protein,calories:+x.calories,ingredients:Array.isArray(x.ingredients)?x.ingredients:[]}}let demo=localEstimate(text);if(!demo)throw new Error('No AI endpoint configured yet. Add it in Settings. The demo parser only knows a few common foods.');return demo}
function localEstimate(text){let s=text.toLowerCase(),defs=[['oats','Oats','g',13.2,379,100],['milk','Milk','ml',3.5,47,250],['skyr','Skyr','g',11,65,250],['chicken','Chicken','g',31,165,150],['rice','Cooked rice','g',2.7,130,200]],ings=[],p=0,c=0;for(let d of defs){if(!s.includes(d[0]))continue;let rx=new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(?:g|ml)?[^,]{0,12}'+d[0]+'|'+d[0]+'[^0-9]{0,12}(\\d+(?:[.,]\\d+)?)','i'),m=text.match(rx),a=+(m?.[1]||m?.[2]||d[5]);p+=d[3]*a/100;c+=d[4]*a/100;ings.push({name:d[1],amount:a,unit:d[2],estimated:!m})}let units=[['almond','Almonds',.26,7,5],['raisin','Raisins',.03,1.5,10],['egg','Eggs',6.3,78,2],['banana','Banana',1.3,105,1]];for(let d of units){if(!s.includes(d[0]))continue;let m=text.match(new RegExp('(\\d+)\\s*(?:x\\s*)?'+d[0]+'s?','i')),a=+(m?.[1]||d[4]);p+=d[2]*a;c+=d[3]*a;ings.push({name:d[1],amount:a,unit:'piece',estimated:!m})}return ings.length?{name:text.slice(0,45),protein:Math.round(p*10)/10,calories:Math.round(c),ingredients:ings}:null}
function close(){M.innerHTML=''}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
})();
</script></body></html>
