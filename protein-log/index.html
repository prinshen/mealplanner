<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Protein Log" />
  <title>Protein Log</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=18.11" />
  <link rel="stylesheet" href="./design.css?v=20.0" />
</head>
<body>
  <div class="app-shell">
    <main id="app" class="app-content" aria-live="polite"></main>
    <nav class="tab-bar" aria-label="Navigation">
      <button class="tab-button active" data-tab="today" aria-label="I dag"><span class="tab-icon">◉</span><span>I dag</span></button>
      <button class="tab-button" data-tab="saved" aria-label="Måltidsbibliotek"><span class="tab-icon">▣</span><span>Måltider</span></button>
      <button class="tab-button" data-tab="review" aria-label="Udvikling"><span class="tab-icon">⌁</span><span>Udvikling</span></button>
      <button class="tab-button" data-tab="settings" aria-label="Indstillinger"><span class="tab-icon">⚙︎</span><span>Indstillinger</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status"></div>
  <script src="./app.js?v=20.0" defer></script>
</body>
</html>
