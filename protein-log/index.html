<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Protein Log" />
  <title>Protein Log</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <main id="app" class="app-content" aria-live="polite"></main>
    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab-button active" data-tab="today" aria-label="Today"><span class="tab-icon">◉</span><span>Today</span></button>
      <button class="tab-button" data-tab="saved" aria-label="Saved meals"><span class="tab-icon">▣</span><span>Saved</span></button>
      <button class="tab-button" data-tab="settings" aria-label="Settings"><span class="tab-icon">⚙︎</span><span>Settings</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="./app.js?v=10" defer></script>
</body>
</html>
